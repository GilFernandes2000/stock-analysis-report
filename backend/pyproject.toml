[project]
name = "stock-analysis-backend"
version = "0.1.0"
description = "Stock analysis platform powered by Finviz"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "finviz==2.0.0",
    "yfinance>=0.2.0",
    "vaderSentiment>=3.3.2",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# pyflakes + core pycodestyle, plus import sorting and pyupgrade. Deliberately
# not enabling flake8-bugbear (B008 fights FastAPI's Depends()-in-defaults
# idiom) or flake8-datetimez / flake8-blind-except: naive UTC and the broad
# `except Exception` around scrapers and network calls are intentional here.
select = ["E4", "E7", "E9", "F", "I", "UP"]
